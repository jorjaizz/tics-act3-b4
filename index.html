<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>San Diego</title>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cartel">
    <p class="sobretitulo">Fundado en 1899</p>
    <h1>Almacén General</h1>
    <p class="lema">Provisiones, ropa y artilugios para el que viaja por el Oeste</p>
  </header>

  <main>
    <!-- mensaje de carga o error -->
    <p id="estado" class="estado" role="status">Revisando el inventario...</p>

    <!-- aqui js inserta los productos -->
    <section id="productos" class="grid" aria-label="Catálogo de productos"></section>
  </main>

  <footer>Mercancía sujeta a existencias. No se aceptan deudas.</footer>

  <script src="script.js"></script>
</body>
</html>
